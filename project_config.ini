# Central configuration for the active Ukrainian WSD pipeline.
# Paths are relative to the repository root.

[paths]
udpipe_model = models/20180506.uk.mova-institute.udpipe
lemmas_file = datasets_pre_defined/unique_lemmas_homonyms.txt
benchmark = datasets_pre_defined/ukrainian_wsd_benchmark.jsonl
raw_sentences_dir = local_datasets/raw_sentences
unique_sentences = local_datasets/raw_sentences/unique_lemma_sentences.jsonl
assigned_meanings = local_datasets/semi_supervised_2/assigned_meanings_mpnet.jsonl
assigned_grouped = local_datasets/semi_supervised_2/lemmas_with_meanings_and_sentences_mpnet.json
filtered_grouped = local_datasets/semi_supervised_2/lemmas_with_meanings_and_sentences_mpnet_filtered.json
generated_sentences = local_datasets/semi_supervised_2/generated_sentences.jsonl
merged_dataset = local_datasets/semi_supervised_2/merged_collected_and_generated_mpnet.json
triplets_dir = local_datasets/semi_supervised_2/triplets
models_dir = models/fine-tuned-models
results_dir = results/finetuning
wsd_results = wsd_model_results.csv

[models]
base_model = sentence-transformers/paraphrase-multilingual-mpnet-base-v2
embedder_model = sentence-transformers/paraphrase-multilingual-mpnet-base-v2
tokenizer = sentence-transformers/paraphrase-multilingual-mpnet-base-v2
mask_model = Goader/modern-liberta-large
translation_uk_en = models/translators/opus-mt-zle-en-ct2
translation_en_uk = models/translators/opus-mt-en-zle-ct2
translation_hf_uk_en = Helsinki-NLP/opus-mt-tc-big-zle-en
translation_hf_en_uk = Helsinki-NLP/opus-mt-tc-big-en-zle

[baseline_models]
wsd = lang-uk/electra-base-ukrainian-cased-discriminator,ukr-models/xlm-roberta-base-uk,google-bert/bert-base-multilingual-cased,intfloat/multilingual-e5-small,sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2,benjamin/roberta-large-wechsel-ukrainian,FacebookAI/xlm-roberta-base,Goader/modern-liberta-large,intfloat/multilingual-e5-base,sentence-transformers/paraphrase-multilingual-mpnet-base-v2,lang-uk/ukr-paraphrase-multilingual-mpnet-base,Qwen/Qwen3-Embedding-0.6B,FacebookAI/xlm-roberta-large,intfloat/multilingual-e5-large,intfloat/multilingual-e5-large-instruct

[collection]
tokenizer = udpipe
spacy_model = uk_core_news_sm
number_of_examples = -1
chunk_size = 128
save_every = 50000
source_news = datasets_pre_defined/ubertext.news.filter_rus_gcld+short.text_only.txt.bz2
output_news = local_datasets/raw_sentences/lemma_examples_news.json
source_fiction = datasets_pre_defined/ubertext.fiction.filter_rus_gcld+short.text_only.txt.bz2
output_fiction = local_datasets/raw_sentences/lemma_examples_fiction.json
source_wikipedia = datasets_pre_defined/ubertext.wikipedia.filter_rus_gcld+short.text_only.txt.bz2
output_wikipedia = local_datasets/raw_sentences/lemma_examples_wikipedia.json

[assignment]
batch_size = 2048
temperature = 0.05
cutoff_probability = 0.9
cutoff_similarity = 0.6

[filtering]
model = sentence-transformers/paraphrase-multilingual-mpnet-base-v2
threshold = 0.95
batch_size = 512

[generation]
model = gpt-4o-mini
min_sentences = 5
seed = 42

[augmentation]
input_dataset = local_datasets/semi_supervised_2/merged_collected_and_generated_mpnet.json
batch_size = 256
combined_batch_size = 8
num_workers = 2
num_variants = 16
combined_variants = 16
combined_markov_probability = 0.75
mask_rate = 0.15
mask_batch_size = 128
combined_mask_batch_size = 16
seed = 42
mask_gpu = 0
mask_definitions_gpu = 1
translation_gpu = 2
translation_definitions_gpu = 3
combined_gpu = 0
combined_definitions_gpu = 1
dropout_output = local_datasets/augmented/dropout/augmented_sentences_16_samples.jsonl
dropout_definitions_output = local_datasets/augmented/dropout/augmented_sentences_definitions_16_samples.jsonl
mask_output = local_datasets/augmented/mask/augmented_sentences_16_samples.jsonl
mask_definitions_output = local_datasets/augmented/mask/augmented_sentences_definitions_16_samples.jsonl
shuffling_output = local_datasets/augmented/token_shuffling/augmented_sentences_16_samples.jsonl
shuffling_definitions_output = local_datasets/augmented/token_shuffling/augmented_sentences_definitions_16_samples.jsonl
translation_output = local_datasets/augmented/translation/augmented_sentences_translated_16_samples.jsonl
translation_definitions_output = local_datasets/augmented/translation/augmented_sentences_translated_definitions_16_samples.jsonl
combined_output = local_datasets/augmented/all_together/augmented_sentences_16_samples.jsonl
combined_definitions_output = local_datasets/augmented/all_together/augmented_sentences_definitions_16_samples.jsonl

[triplets]
tokenizer = sentence-transformers/paraphrase-multilingual-mpnet-base-v2
max_sentences_per_meaning = 100
seed = 42
use_augmented = true
use_definitions_augmented = true
default_output = local_datasets/semi_supervised_2/triplets/triplets_default.csv
context_augmentation_paths = local_datasets/augmented/token_shuffling/augmented_sentences.jsonl,local_datasets/augmented/translation/augmented_sentences_translated_v3.jsonl,local_datasets/augmented/dropout/augmented_sentences.jsonl,local_datasets/augmented/mask/augmented_sentences.jsonl
definition_augmentation_paths = local_datasets/augmented/token_shuffling/augmented_sentences_definitions.jsonl,local_datasets/augmented/translation/augmented_sentences_translated_definitions.jsonl,local_datasets/augmented/dropout/augmented_sentences_definitions.jsonl,local_datasets/augmented/mask/augmented_sentences_definitions.jsonl
natural_output = local_datasets/semi_supervised_2/triplets/triplets_natural.csv
generation_output = local_datasets/semi_supervised_2/triplets/triplets_generation.csv
mask_output = local_datasets/semi_supervised_2/triplets/triplets_generation_mask.csv
dropout_output = local_datasets/semi_supervised_2/triplets/triplets_generation_dropout.csv
translation_output = local_datasets/semi_supervised_2/triplets/triplets_generation_translation.csv
shuffling_output = local_datasets/semi_supervised_2/triplets/triplets_generation_token_shuffling.csv
stochastic_output = local_datasets/semi_supervised_2/triplets/triplets_generation_stochastic_combination.csv
all_combined_output = local_datasets/semi_supervised_2/triplets/triplets_generation_all_combined.csv

[training]
train_data_path = local_datasets/semi_supervised_2/triplets/triplets_generation.csv
loss_type = triplet_loss_cosine
pool_targets = true
use_both_poolings = false
model_to_fine_tune = sentence-transformers/paraphrase-multilingual-mpnet-base-v2
tokenizer_name = sentence-transformers/paraphrase-multilingual-mpnet-base-v2
batch_size = 104
num_batch_to_eval = 200
validation_split = 0.01
split_seed = 42
layers_to_unfreeze = 0
random_model_weights_reinitialization = false
number_of_layers_for_reinitialization = 3
learning_rate = 2e-6
apply_warmup = true
warmup_ratio = 0.1
num_epochs = 2
early_stopping = 10
enable_gpu_parallel = true
max_grad_norm = 1.0
path_to_save_fine_tuned_model = models/fine-tuned-models
evaluate_final_wsd = true
hf_dataset =
hf_subset =

[evaluation]
device = cpu
mteb_device = cuda:0
mteb_num_proc = 1
mteb_cache = cache/mteb
sts_dataset = anikol12/STSB-UK
results_dir = results/finetuning
wsd_output = wsd_model_results.csv

[mteb]
tasks = SIB200Classification,UkrFormalityClassification,SIB200ClusteringS2S,WebFAQBitextMiningQAs,WebFAQBitextMiningQuestions,NTREXBitextMining,BibleNLPBitextMining,FloresBitextMining,Tatoeba,BelebeleRetrieval,WebFAQRetrieval
modalities = text

[mteb_subsets]
SIB200Classification = ukr_Cyrl
UkrFormalityClassification = default
SIB200ClusteringS2S = ukr_Cyrl
WebFAQBitextMiningQAs = eng-ukr
WebFAQBitextMiningQuestions = eng-ukr
NTREXBitextMining = eng_Latn-ukr_Cyrl
BibleNLPBitextMining = eng_Latn-ukr_Cyrl
FloresBitextMining = eng_Latn-ukr_Cyrl
Tatoeba = ukr-eng
BelebeleRetrieval = ukr_Cyrl-ukr_Cyrl
WebFAQRetrieval = ukr

[wandb]
log_to_wandb = true
wandb_entity =
wandb_project_name = ucu-wsd-finetuning

[huggingface]
repo_prefix =
private = false
delete_local_model = false

[experiments]
gpus = 0,1,2,3
seeds = 42,123,456
force = false
